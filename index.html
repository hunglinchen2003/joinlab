<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陳宏霖老師實驗室導覽 · BiotechOpoly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#070b22;
  --bg-mid:#101942;
  --board-border:#141e3c;
  --cell-bg:#e8f8f5;
  --cell-bg-2:#dff5f2;
  --cell-ink:#111d38;
  --cell-sub:#2b426b;
  --pink:#ff4d94;
  --blue:#3a86ff;
  --cyan:#00bbf9;
  --green:#2ec4b6;
  --lime:#57cc99;
  --purple:#9b5de5;
  --orange:#ff9f1c;
  --yellow:#ffd166;
  --red:#ef476f;
  /* Wide 16:10 rectangular board dimensions */
  --corner-w:146px;
  --corner-h:104px;
  --topbot-w:122px;
  --leftright-h:82px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  font-family:'Outfit','Noto Sans TC',sans-serif;
  background:linear-gradient(135deg, #fffdf7 0%, #eff8ff 36%, #e6faf5 70%, #fdf2f8 100%);
  color:#1e293b;
  overflow:hidden;
  user-select:none;
}

/* ── FLOATING SOFT PASTEL BIOTECH BACKGROUND ── */
.cosmic-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
}
.cosmic-bg svg{
  width:100%;height:100%;
}

/* ── TOP NAVIGATION BAR (BRIGHT FROSTED GLASS) ── */
nav{
  height:50px;
  background:rgba(255,255,255,0.86);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:2px solid rgba(148,163,184,0.25);
  display:flex;align-items:center;
  padding:0 max(16px,env(safe-area-inset-left,0px));
  gap:10px;position:relative;z-index:50;
  box-shadow:0 4px 18px rgba(15,23,42,0.06);
}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-badge-icon{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#38bdf8,#a855f7);
  border:2px solid #0b132b;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 2px 0 #0b132b;
}
.nav-logo{
  font-family:'Outfit',sans-serif;font-size:17px;font-weight:900;
  background:linear-gradient(90deg,#0284c7,#7c3aed,#ec4899);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:.03em;line-height:1.1;
}
.nav-sub{font-size:11px;font-weight:800;color:#475569;letter-spacing:.04em}
.nav-sp{flex:1}
.nav-3d-btn{
  padding:5px 13px;border-radius:99px;
  border:2px solid #0b132b;
  background:#e0f2fe;
  color:#0f172a;font-size:11.5px;font-weight:900;
  box-shadow:0 2px 0 #0b132b;
  cursor:pointer;transition:all .18s;
}
.nav-3d-btn:hover{background:#bae6fd;transform:translateY(-1px)}
.nav-last-roll{
  font-size:12px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,#3a86ff,#8338ec);
  border:2px solid #0b132b;
  padding:4px 13px;border-radius:99px;
  display:none;align-items:center;gap:6px;
  box-shadow:0 2px 0 #0b132b;
}
.nav-last-roll.show{display:inline-flex}
#nav-turn{
  font-size:12px;font-weight:900;color:#111d38;
  background:linear-gradient(135deg,#ffd166,#ff9f1c);
  padding:5px 14px;border-radius:99px;
  border:2px solid #0b132b;
  box-shadow:0 2px 0 #0b132b;
  display:none;align-items:center;gap:6px;
}
#nav-turn.show{display:inline-flex}

/* ── MAIN STAGE WRAP WITH 3D PERSPECTIVE ── */
.wrap{
  height:calc(100% - 50px);
  display:flex;align-items:center;justify-content:center;
  padding:4px;overflow:hidden;position:relative;z-index:2;
}

/* ── 3D TABLETOP BOARD FRAME (SINGLE CLEAN 3D PLANE FOR ACCURATE CLICK HIT-TESTING) ── */
.board-scale{
  transform-origin:center center;
  transition:transform .25s ease;
}
.board-3d-tilt{
  transform:perspective(1300px) rotateX(19deg) translateY(-6px);
  transition:transform .45s cubic-bezier(.25,.8,.25,1);
}
.board-3d-tilt.flat-mode{
  transform:perspective(1300px) rotateX(0deg) translateY(0);
}
.board-wrap{
  padding:11px;
  border-radius:24px;
  background:linear-gradient(180deg,#72efdd 0%,#38bdf8 50%,#60a5fa 100%);
  border:3.5px solid #0b132b;
  position:relative;
  /* Soft Bright Tabletop 3D Extrusion & Natural Drop Shadow */
  box-shadow:
    0 6px 0 #0284c7,
    0 12px 0 #0369a1,
    0 18px 0 #1e3a8a,
    0 22px 0 #0b132b,
    0 34px 65px rgba(30,64,175,0.22),
    0 14px 28px rgba(15,23,42,0.14),
    inset 0 3px 5px rgba(255,255,255,0.75);
}
/* 3D Side Lip highlight */
.board-wrap::after{
  content:'';position:absolute;left:12px;right:12px;bottom:-14px;height:12px;
  background:linear-gradient(90deg,rgba(56,189,248,0.2),rgba(114,239,221,0.5),rgba(56,189,248,0.2));
  border-radius:0 0 18px 18px;
  pointer-events:none;
}

.board{
  display:grid;
  grid-template-columns:var(--corner-w) repeat(6,var(--topbot-w)) var(--corner-w);
  grid-template-rows:var(--corner-h) repeat(6,var(--leftright-h)) var(--corner-h);
  background:#141e3c;
  gap:2.5px;
  border:3.5px solid #141e3c;
  border-radius:14px;
  position:relative;
  box-shadow:inset 0 4px 12px rgba(0,0,0,0.6);
}

/* ── SQUARES (3D ELEVATED TILES) ── */
.sq{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,#f5fffd 0%,#dcf4f0 100%);
  color:var(--cell-ink);
  padding:4px 5px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,0.9), inset 0 -3px 0 rgba(148,163,184,0.35);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
}
.sq:hover{
  transform:translateY(-6px) scale(1.05);
  z-index:20;
  box-shadow:0 12px 22px rgba(15,23,42,0.38), 0 5px 0 #1d3557, inset 0 0 0 2.5px #3a86ff;
}
.sq.active-step{
  z-index:22;
  transform:translateY(-4px) scale(1.03);
  background:linear-gradient(180deg,#fffbeb 0%,#fef08a 100%) !important;
  box-shadow:0 8px 20px rgba(255,77,148,0.55), 0 4px 0 #be185d, inset 0 0 0 3.5px #ff4d94 !important;
}

/* Inner Color Strip facing the Center with 3D Bevel */
.sq-strip{
  position:absolute;
  z-index:2;
  box-shadow:inset 0 2px 2px rgba(255,255,255,0.45), inset 0 -2px 2px rgba(0,0,0,0.2);
}
.sq.top{padding-bottom:16px}
.sq.top .sq-strip{
  left:0;right:0;bottom:0;height:13px;
  border-top:2.5px solid #141e3c;
}
.sq.bot{padding-top:16px}
.sq.bot .sq-strip{
  left:0;right:0;top:0;height:13px;
  border-bottom:2.5px solid #141e3c;
}
.sq.left{padding-right:18px}
.sq.left .sq-strip{
  top:0;bottom:0;right:0;width:14px;
  border-left:2.5px solid #141e3c;
}
.sq.right{padding-left:18px}
.sq.right .sq-strip{
  top:0;bottom:0;left:0;width:14px;
  border-right:2.5px solid #141e3c;
}

/* Cell Text Header */
.sq-head{
  text-align:center;
  width:100%;
  z-index:3;
  line-height:1.12;
  margin-top:1px;
}
.sq-name{
  font-size:11.5px;
  font-weight:900;
  color:#0f172a;
  letter-spacing:-0.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sq-en{
  font-size:8px;
  font-weight:800;
  color:#334e7b;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sq.left .sq-name, .sq.right .sq-name{font-size:11px}
.sq.left .sq-en, .sq.right .sq-en{font-size:7.5px}

/* Cell Cute Vector Illustration */
.sq-art{
  flex:1;
  width:100%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  z-index:2;
  min-height:0;
}
.sq-art svg{
  width:100%;
  height:100%;
  max-height:58px;
  overflow:visible;
  pointer-events:none;
}
.sq.left .sq-art svg, .sq.right .sq-art svg{
  max-height:46px;
}
.sq.corner .sq-art svg{
  max-height:74px;
}

/* Corner Specific Styling */
.sq.corner{
  background:linear-gradient(145deg,#f6fffd 0%,#d7f3ee 100%);
  padding:5px;
  justify-content:space-between;
}
.sq.corner:hover{
  border-radius:6px;
}
.sq.corner-jail{
  padding:0;
  display:grid;
  grid-template-columns:22px 1fr;
  grid-template-rows:1fr 24px;
}
.jail-side-label{
  grid-column:1;grid-row:1/3;
  background:#e8f8f5;
  border-right:2.5px solid #141e3c;
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:11px;font-weight:900;color:#111d38;letter-spacing:.12em;
}
.jail-box{
  grid-column:2;grid-row:1;
  background:linear-gradient(180deg,#ff9f1c 0%,#ffbf69 100%);
  border-bottom:2.5px solid #141e3c;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.jail-bottom-label{
  grid-column:2;grid-row:2;
  background:#e8f8f5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.05;
}

/* ── 3D WALKING LITTLE PEOPLE LAYER (#walkers-layer) ── */
.walkers-layer, .walkers-layer *{
  pointer-events:none !important;
}
.walkers-layer{
  position:absolute;
  inset:0;
  z-index:40;
}
.walker{
  position:absolute;
  width:52px;
  height:68px;
  /* Stand tall on the board without breaking 3D hit-testing */
  transform:translate(-50%, -88%) scaleY(1.08);
  transform-origin:50% 90%;
  transition:left 0.32s linear, top 0.32s linear;
  z-index:42;
}
.board-3d-tilt.flat-mode .walker{
  transform:translate(-50%, -84%) scaleY(1);
}
.walker.active-turn{
  z-index:48;
}

/* Floating Player Name Badge above the Walking Person */
.walker-label{
  position:absolute;
  top:-16px;
  left:50%;
  transform:translateX(-50%);
  background:#0b132b;
  color:#fff;
  font-size:9.5px;
  font-weight:900;
  padding:1.5px 7px;
  border-radius:99px;
  border:1.5px solid #fff;
  white-space:nowrap;
  box-shadow:0 2px 6px rgba(0,0,0,0.6);
  display:flex;align-items:center;gap:3px;
}
.walker.active-turn .walker-label{
  background:#ffd166;
  color:#0b132b;
  border-color:#0b132b;
  transform:translateX(-50%) scale(1.08);
}

/* Character SVG Flip & Articulated Limb Animations */
.walker-svg{
  width:52px;
  height:64px;
  overflow:visible;
  transition:transform 0.15s ease;
}
.walker[data-dir="-1"] .walker-svg{
  transform:scaleX(-1);
}

/* Idle gentle breathing when standing still */
.walker .ch-body-group{
  transform-origin:26px 46px;
  animation:idleBreathe 1.8s ease-in-out infinite;
}
@keyframes idleBreathe{
  0%,100%{transform:translateY(0) scaleY(1)}
  50%{transform:translateY(-1.5px) scaleY(1.02)}
}

/* Walking Articulated Limb & Hop Animations */
.walker.walking .ch-body-group{
  animation:walkHop 0.16s ease-in-out infinite alternate;
}
.walker.walking .ch-leg-l{
  animation:swingLegL 0.16s ease-in-out infinite alternate;
}
.walker.walking .ch-leg-r{
  animation:swingLegR 0.16s ease-in-out infinite alternate;
}
.walker.walking .ch-arm-l{
  animation:swingArmL 0.16s ease-in-out infinite alternate;
}
.walker.walking .ch-arm-r{
  animation:swingArmR 0.16s ease-in-out infinite alternate;
}
.walker.walking .ch-shadow{
  animation:shadowPulse 0.16s ease-in-out infinite alternate;
}

.ch-leg-l, .ch-leg-r{transform-origin:26px 45px}
.ch-arm-l, .ch-arm-r{transform-origin:26px 32px}
.ch-shadow{transform-origin:26px 59px}

@keyframes walkHop{
  0%{transform:translateY(0) rotate(-3deg)}
  100%{transform:translateY(-6px) rotate(4deg)}
}
@keyframes swingLegL{
  0%{transform:rotate(-34deg)}
  100%{transform:rotate(34deg)}
}
@keyframes swingLegR{
  0%{transform:rotate(34deg)}
  100%{transform:rotate(-34deg)}
}
@keyframes swingArmL{
  0%{transform:rotate(30deg)}
  100%{transform:rotate(-30deg)}
}
@keyframes swingArmR{
  0%{transform:rotate(-30deg)}
  100%{transform:rotate(30deg)}
}
@keyframes shadowPulse{
  0%{transform:scale(1);opacity:0.45}
  100%{transform:scale(0.75);opacity:0.25}
}

/* ── CENTER HUB: 未來生技研發中心 (SOFT BRIGHT PASTEL LAB STAGE) ── */
.board-center{
  grid-column:2/8;grid-row:2/8;
  position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%, #ffffff 0%, #e0f7fa 48%, #bae6fd 100%);
  border:3px solid #38bdf8;
  box-shadow:
    inset 0 6px 20px rgba(14,116,144,0.18),
    inset 0 0 30px rgba(255,255,255,0.8),
    inset 0 0 0 2px #141e3c;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:12px 16px;
}

/* Background Isometric Lab Artwork Layer */
.center-art-layer, .center-art-layer *{
  pointer-events:none !important;
}
.center-art-layer{
  position:absolute;inset:0;z-index:1;
}
.center-art-layer svg{
  width:100%;height:100%;
}

/* Top Row inside Center: 3D Tilted Title + Active Players / Controls */
.center-top-bar{
  position:relative;z-index:10;
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:12px;
}

/* 3D Extruded Tilted Title (Left) */
.iso-title-box{
  transform:rotate(-14deg) skewX(-8deg);
  transform-origin:top left;
  margin-left:8px;margin-top:6px;
  pointer-events:none;
}
.iso-biotech{
  font-family:'Outfit',sans-serif;
  font-size:34px;font-weight:900;line-height:0.95;
  letter-spacing:.04em;
  color:#38bdf8;
  -webkit-text-stroke:2px #0b132b;
  text-shadow:
    1px 1px 0 #0b132b,
    2px 2px 0 #0284c7,
    3px 3px 0 #0369a1,
    4px 4px 0 #1e3a8a,
    5px 5px 0 #0b132b;
}
.iso-opoly{
  font-family:'Outfit',sans-serif;
  font-size:28px;font-weight:900;line-height:1.05;
  letter-spacing:.06em;
  color:#ffd166;
  -webkit-text-stroke:2px #0b132b;
  margin-left:14px;
  text-shadow:
    1px 1px 0 #0b132b,
    2px 2px 0 #f77f00,
    3px 3px 0 #d62828,
    4px 4px 0 #0b132b;
}
.iso-sub{
  font-size:13.5px;font-weight:900;
  color:#0f172a;
  background:rgba(255,255,255,0.95);
  border:2px solid #0b132b;
  padding:2px 12px;border-radius:99px;
  display:inline-block;margin-top:4px;margin-left:6px;
  box-shadow:0 3px 0 #0b132b;
}

/* Interactive Dice & Turn Console (Bright Cream Card) */
.center-dice-console{
  position:relative;
  z-index:15;
  pointer-events:auto;
  background:#ffffff;
  border:2.5px solid #0b132b;
  border-radius:18px;
  padding:10px 14px;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  box-shadow:0 6px 0 #0b132b, 0 12px 24px rgba(15,23,42,0.16);
  min-width:270px;
}
.console-top-row{
  display:flex;align-items:center;gap:12px;width:100%;justify-content:center;
}
.die-wrap{
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.dice{
  width:52px;height:52px;
  background:linear-gradient(145deg,#ffffff 0%,#f8fafc 65%,#e0f2fe 100%);
  border-radius:12px;
  border:2.5px solid #0b132b;
  padding:6px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  place-items:center;
  box-shadow:0 4px 0 #1e293b, 0 6px 12px rgba(15,23,42,0.18), inset 0 2px 3px #fff;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
}
.dice.rolled-glow{
  border-color:#0b132b;
  background:linear-gradient(145deg,#fffbeb 0%,#fef3c7 100%);
  box-shadow:0 4px 0 #d97706, 0 0 16px rgba(251,191,36,0.75);
}
.dice.rolling{
  animation:diceRoll3D .34s ease-in-out infinite;
}
@keyframes diceRoll3D{
  0%{transform:rotate(0deg) scale(1)}
  25%{transform:rotate(18deg) scale(1.14) translateY(-4px)}
  50%{transform:rotate(-16deg) scale(0.92)}
  75%{transform:rotate(12deg) scale(1.08) translateY(-2px)}
  100%{transform:rotate(0deg) scale(1)}
}
.pip{
  width:9px;height:9px;border-radius:50%;
  background:#0f172a;
  opacity:0;transform:scale(0.3);
  transition:opacity .1s ease, transform .14s cubic-bezier(.34,1.6,.64,1);
}
.pip.on{opacity:1;transform:scale(1)}
.dice[data-val="1"] .pip.on{
  width:13px;height:13px;
  background:radial-gradient(circle at 35% 35%,#ef4444,#b91c1c);
}
.dice[data-val="4"] .pip.on{
  background:radial-gradient(circle at 35% 35%,#ef4444,#b91c1c);
}
.die-num-tag{
  font-size:10.5px;font-weight:900;color:#334155;
  background:#f1f5f9;border:1.5px solid #94a3b8;
  padding:1px 8px;border-radius:99px;
}
.die-num-tag.highlight{
  color:#0b132b;background:#ffd166;border-color:#0b132b;
}
.dice-plus{
  font-size:18px;font-weight:900;color:#64748b;margin-bottom:16px;
}

/* Dice Result Pill */
.dice-result{
  width:100%;
  padding:5px 12px;
  border-radius:10px;
  background:#f1f5f9;
  border:1.5px solid #cbd5e1;
  color:#475569;
  font-size:12.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:6px;
  text-align:center;
  transition:all .25s cubic-bezier(.34,1.4,.64,1);
}
.dice-result.show{
  background:linear-gradient(135deg,#ff4d94,#8338ec,#3a86ff);
  border:2px solid #0b132b;
  color:#fff;
  font-size:14px;font-weight:900;
  box-shadow:0 3px 0 #0b132b, 0 4px 14px rgba(255,77,148,0.35);
  transform:scale(1.03);
}
.dice-total-badge{
  background:#ffd166;color:#0b132b;
  padding:1px 8px;border-radius:99px;font-size:13.5px;font-weight:900;
  border:1.5px solid #0b132b;
}

/* Console Buttons */
.console-btns{
  display:flex;align-items:center;gap:8px;width:100%;justify-content:center;
}
#roll-btn{
  flex:1;padding:7px 14px;border-radius:99px;
  border:2px solid #0b132b;cursor:pointer;
  font-size:12.5px;font-weight:900;
  background:linear-gradient(180deg,#ffd166 0%,#ff9f1c 100%);
  color:#0b132b;
  box-shadow:0 3px 0 #0b132b;
  transition:all .15s;
}
#roll-btn:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 5px 0 #0b132b, 0 0 14px rgba(255,209,102,0.6);
}
#roll-btn:disabled{
  opacity:.48;cursor:not-allowed;transform:none;box-shadow:none;
}
#join-btn{
  padding:7px 13px;border-radius:99px;
  border:2px solid #0b132b;cursor:pointer;
  font-size:12px;font-weight:900;
  background:linear-gradient(180deg,#72efdd 0%,#00bbf9 100%);
  color:#0b132b;
  box-shadow:0 3px 0 #0b132b;
  transition:all .15s;
}
#join-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 0 #0b132b, 0 0 14px rgba(114,239,221,0.6);
}

/* 3D Tilted Card Decks (機會 & 命運) + Bottom Player Bar */
.center-bottom-bar{
  position:relative;z-index:10;
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:10px;
}

.card-deck-3d{
  pointer-events:auto;
  width:136px;height:96px;
  border-radius:14px;
  border:2.5px solid #0b132b;
  padding:8px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  cursor:pointer;

// ── 3D WALKING CHARACTERS POSITIONING & ANIMATION ─────────────
function getSquareCoords(sqId, playerIdx, totalOnSquare){
  const sqEl=document.getElementById(`sq-${sqId}`);
  if(!sqEl) return {x:0, y:0};
  const cx = sqEl.offsetLeft + sqEl.offsetWidth / 2;
  const cy = sqEl.offsetTop + sqEl.offsetHeight * 0.68;

  // Slight fan-out offset when multiple characters stand on the same square
  let ox=0, oy=0;
  if(totalOnSquare > 1){
    const angle = (playerIdx / totalOnSquare) * Math.PI * 2;
    ox = Math.cos(angle) * 16;
    oy = Math.sin(angle) * 8;
  }
  return {x: cx + ox, y: cy + oy};
}

function renderTokens(walkingPlayerIdx = -1){
  document.querySelectorAll('.sq').forEach(el=>el.classList.remove('active-step'));
  const layer=document.getElementById('walkers-layer');

  // Count how many players are on each square for neat spacing
  const posGroups={};
  players.forEach((p, idx)=>{
    if(!posGroups[p.pos]) posGroups[p.pos]=[];
    posGroups[p.pos].push(idx);
  });

  players.forEach((p, idx)=>{
    let walker=document.getElementById(`walker-${idx}`);
    if(!walker){
      walker=document.createElement('div');
      walker.id=`walker-${idx}`;
      walker.className='walker';
      walker.setAttribute('data-dir', '1');
      walker.innerHTML=`
        <div class="walker-label">
          <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${COLORS[p.colorIdx]}"></span>
          <span>${p.name}</span>
        </div>
        ${buildCharacterSVG(p.av, COLORS[p.colorIdx])}
      `;
      layer.appendChild(walker);
    }

    const group=posGroups[p.pos]||[idx];
    const slotIdx=group.indexOf(idx);
    const {x, y}=getSquareCoords(p.pos, slotIdx, group.length);

    // Determine facing direction based on horizontal movement
    const prevX = parseFloat(walker.dataset.x || x);
    if(Math.abs(x - prevX) > 4){
      walker.setAttribute('data-dir', x < prevX ? '-1' : '1');
    }
    walker.dataset.x = x;
    walker.dataset.y = y;

    walker.style.left = `${x}px`;
    walker.style.top = `${y}px`;
    walker.classList.toggle('active-turn', idx===currentPlayer && gameStarted);
    walker.classList.toggle('walking', idx===walkingPlayerIdx);

    if(idx===currentPlayer && gameStarted){
      const sqEl=document.getElementById(`sq-${p.pos}`);
      if(sqEl) sqEl.classList.add('active-step');
    }
  });
}

// ── DICE & REAL WALKING STEP-BY-STEP MOVE ─────────────────────
function doRoll(){
  if(!gameStarted||diceRolling||!players.length)return;
  const p=players[currentPlayer];
  if(p.skipTurns>0){
    p.skipTurns--;
    toast(`⏳ ${p.name} 暫停回合中（剩餘 ${p.skipTurns} 回合）`);
    nextTurn();return;
  }
  diceRolling=true;
  document.getElementById('roll-btn').disabled=true;
  const d1=document.getElementById('dice1');
  const d2=document.getElementById('dice2');
  d1.classList.remove('rolled-glow');
  d2.classList.remove('rolled-glow');
  d1.classList.add('rolling');
  d2.classList.add('rolling');

  const res=document.getElementById('dice-result');
  res.classList.remove('show');
  res.innerHTML=`<span>🎲 ${p.name} 正在擲骰子…</span>`;

  let count=0;
  const anim=setInterval(()=>{
    const temp1=Math.ceil(Math.random()*6);
    const temp2=Math.ceil(Math.random()*6);
    setDieFace('dice1', temp1, 'die1-num', false);
    setDieFace('dice2', temp2, 'die2-num', false);
    count++;
    if(count>14){
      clearInterval(anim);
      d1.classList.remove('rolling');
      d2.classList.remove('rolling');
      d1.classList.add('rolled-glow');
      d2.classList.add('rolled-glow');

      const r1=Math.ceil(Math.random()*6);
      const r2=Math.ceil(Math.random()*6);
      setDieFace('dice1', r1, 'die1-num', true);
      setDieFace('dice2', r2, 'die2-num', true);
      const total=r1+r2;

      lastRollInfo={r1, r2, total, playerName:p.name};

      res.innerHTML=`<span>🎲 點數：<strong>${r1}</strong> + <strong>${r2}</strong> =</span> <span class="dice-total-badge">共 ${total} 點</span>`;
      res.classList.add('show');

      const navRoll=document.getElementById('nav-last-roll');
      navRoll.innerHTML=`🎲 ${p.name} 擲出：<strong>${r1} + ${r2} = ${total} 點</strong>`;
      navRoll.classList.add('show');

      toast(`🎲 ${p.name} 擲出 ${r1} + ${r2} = ${total} 點！小人出發！`);

      setTimeout(()=>movePlayerStepByStep(total, 1), 420);
    }
  },55);
}

function movePlayerStepByStep(steps, dir = 1, onComplete = null){
  const p=players[currentPlayer];
  let remaining=steps;

  // Start walking limb animation immediately
  renderTokens(currentPlayer);

  const stepInterval=setInterval(()=>{
    if(remaining<=0){
      clearInterval(stepInterval);
      // Stop walking limb animation
      renderTokens(-1);
      if(onComplete){
        setTimeout(onComplete, 380);
      } else {
        setTimeout(()=>onLand(currentPlayer), 420);
      }
      return;
    }
    const oldPos=p.pos;
    p.pos=(p.pos + dir + 28) % 28;
    if(dir > 0 && p.pos===0 && oldPos===27){
      toast(`🚀 ${p.name} 經過起點！啟動研究能量！`);
    }
    remaining--;
    renderTokens(currentPlayer);
    renderPlayerList();
  }, 330);
}

function onLand(pi){
  const p=players[pi];
  const sq=SQ[p.pos];
  diceRolling=false;
  if(sq.type==='goJail'){
    toast(`⚠️ ${p.name} 觸發污染警報，送往隔離觀察室！`);
    p.pos=7;p.inJail=true;p.skipTurns=1;
    renderTokens(-1);renderPlayerList();
    setTimeout(nextTurn,1400);
    return;
  }
  if(sq.type==='jail'){toast(`🔒 ${p.name} 路過隔離觀察室（安全訪客）`);setTimeout(nextTurn,1100);return;}
  if(sq.type==='free'){toast(`☕ ${p.name} 抵達午茶與跨界交流區！`);setTimeout(nextTurn,1100);return;}
  if(sq.type==='start'){toast(`🚀 ${p.name} 回到起點！啟動研究！`);setTimeout(nextTurn,1100);return;}
  if(sq.type==='chance'){
    pendingCard=CHANCE[Math.floor(Math.random()*CHANCE.length)];
    showCardModal(pendingCard,'機會');return;
  }
  if(sq.type==='grant'){
    pendingCard=GRANT[Math.floor(Math.random()*GRANT.length)];
    showCardModal(pendingCard,'命運');return;
  }
  showSqModal(p.pos, true);
}

function nextTurn(){
  if(!players.length)return;
  currentPlayer=(currentPlayer+1)%players.length;
  diceRolling=false;
  document.getElementById('roll-btn').disabled=false;
  renderTokens(-1);
  renderPlayerList();
  updateNav();
}

  content.innerHTML=`
    ${rollBadge}
    <div style="font-family:'Outfit';font-size:12px;font-weight:900;letter-spacing:.12em;color:${type==='機會'?'#ef476f':'#d97706'};text-transform:uppercase;margin-bottom:6px">
      ${type==='機會'?'❓ 機會 · 創新靈感 (Discovery)':'💡 命運 · 研究經費 (Grant)'}</div>
    <div class="card-visual">${card.emoji}</div>
    <h2>${card.title}</h2>
    <p style="margin-top:6px">${card.desc}</p>
    <div class="card-effect" style="background:${type==='機會'?'#ffe5ec':'#fef3c7'}">${card.text}</div>
  `;
  document.getElementById('card-modal').classList.remove('hidden');
}

function applyCard(){
  document.getElementById('card-modal').classList.add('hidden');
  if(!pendingCard)return;
  const p=players[currentPlayer];
  const card=pendingCard;pendingCard=null;
  if(card.effect==='advance'){
    toast(`${p.name} 前進 ${card.val} 格！`);
    movePlayerStepByStep(card.val, 1, ()=>nextTurn());
  }else if(card.effect==='back'){
    toast(`${p.name} 退後 ${card.val} 格`);
    movePlayerStepByStep(card.val, -1, ()=>nextTurn());
  }else if(card.effect==='skip'){
    p.skipTurns=(p.skipTurns||0)+card.val;
    toast(`${p.name} 暫停 ${card.val} 回合`);
    setTimeout(nextTurn,600);
  }
}

function closeModal(id){
  document.getElementById(id).classList.add('hidden');
}

// ── TOAST ─────────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}

// ── RESPONSIVE SCALE ──────────────────────────────────────────
function scaleBoard(){
  const wrap=document.querySelector('.wrap');
  const availW=wrap.clientWidth-20;
  const availH=wrap.clientHeight-24;
  const boardW=1080;
  const boardH=is3DMode ? 730 : 760;
  const scale=Math.min(1.06, availW/boardW, availH/boardH);
  document.getElementById('board-scale').style.transform=`scale(${scale})`;
}

// ── INIT ──────────────────────────────────────────────────────
initDiceDOM();
buildBoard();
scaleBoard();
window.addEventListener('resize', ()=>{
  scaleBoard();
  renderTokens(-1);
});

document.querySelectorAll('.modal-bg').forEach(bg=>{
  bg.addEventListener('click',e=>{
    if(e.target===bg){
      if(bg.id==='card-modal')return;
      if(bg.id==='sq-modal'){closeSqModal();return;}
      closeModal(bg.id);
    }
  });
});
</script>
</body>
